<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183D29" />
      <stop offset="100%" stop-color="#0E2418" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#22543D" stroke-width="6" opacity="0.4" />

  <!-- Stylized Agricultural Sprout / Plant -->
  <!-- Stem -->
  <path d="M256 380 V 220" stroke="url(#leafGrad)" stroke-width="20" stroke-linecap="round" />
  
  <!-- Soil / Earth curves -->
  <path d="M176 380 Q 256 405 336 380" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" fill="none" />
  <path d="M206 410 Q 256 425 306 410" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Left Leaf -->
  <path d="M256 310 C 210 310 160 260 170 200 C 220 200 256 260 256 310 Z" fill="url(#leafGrad)" />
  
  <!-- Right Leaf -->
  <path d="M256 260 C 295 260 345 220 338 165 C 295 165 256 215 256 260 Z" fill="url(#leafGrad)" />
  
  <!-- Central Top Seed Shoot / Sun Ray -->
  <circle cx="256" cy="140" r="22" fill="url(#goldGrad)" />
  <path d="M256 175 V 215" stroke="url(#leafGrad)" stroke-width="14" stroke-linecap="round" />
</svg>
