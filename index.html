    <meta name="author" content="Adams Kipkoech Kering" />
    <meta property="og:title" content="AgriHub — Grow Knowledge. Share Progress. Build the Future." />
    <meta property="og:description" content="Global agricultural community, short-form reels, field stories, direct farmer chat, 26 precision farm tools, and marketplace founded by Adams Kipkoech Kering." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite dev server HMR WebSocket proxy errors in preview environments
      (function() {
        const isWsError = (str) => {
          if (!str || typeof str !== 'string') return false;
          return str.includes('WebSocket') || 
                 str.includes('closed without opened') || 
                 str.includes('[vite]') || 
                 str.includes('ws://') || 
                 str.includes('wss://');
        };

        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.some(a => isWsError(typeof a === 'string' ? a : (a && a.message) || ''))) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(a => isWsError(typeof a === 'string' ? a : (a && a.message) || ''))) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          const msg = event?.message || event?.error?.message || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event?.reason?.message || String(event?.reason || '');
          if (isWsError(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
