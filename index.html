    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress Vite dev server HMR WebSocket proxy errors in preview environments
      (function() {
        const isWsError = (err) => {
          if (!err) return false;
          const str = typeof err === 'string' ? err : `${err.message || ''} ${err.stack || ''} ${String(err)}`;
          return str.includes('WebSocket') || 
                 str.includes('closed without opened') || 
                 str.includes('[vite]') || 
                 str.includes('ws://') || 
                 str.includes('wss://');
        };

        const origConsoleError = console.error;
        console.error = function(...args) {
          if (args.some(a => isWsError(a))) {
            return;
          }
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(a => isWsError(a))) {
            return;
          }
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isWsError(event?.error) || isWsError(event?.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event?.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
